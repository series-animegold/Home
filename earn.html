      background-attachment: fixed;
      color: #fff;
      text-align: center;
      min-height: 100vh;
      overflow-x: hidden;
    }

    @keyframes gradient {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .particles {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      z-index: 0;
      pointer-events: none;
    }

    .particle {
      position: absolute;
      width: 4px;
      height: 4px;
      background: rgba(255, 152, 0, 0.5);
      border-radius: 50%;
      animation: float 20s infinite;
    }

    .particle:nth-child(1) { left: 10%; top: 20%; animation-delay: 0s; }
    .particle:nth-child(2) { left: 80%; top: 80%; animation-delay: 2s; }
    .particle:nth-child(3) { left: 50%; top: 50%; animation-delay: 4s; }
    .particle:nth-child(4) { left: 20%; top: 70%; animation-delay: 6s; }
    .particle:nth-child(5) { left: 90%; top: 30%; animation-delay: 8s; }
    .particle:nth-child(6) { left: 30%; top: 10%; animation-delay: 10s; }
    .particle:nth-child(7) { left: 70%; top: 60%; animation-delay: 12s; }
    .particle:nth-child(8) { left: 15%; top: 50%; animation-delay: 14s; }

    @keyframes float {
      0%, 100% { transform: translate(0, 0) scale(1); opacity: 0; }
      50% { opacity: 1; }
      100% { transform: translate(100px, -100px) scale(0.5); opacity: 0; }
    }

    h1 {
      font-size: 2em;
      margin: 30px 0 10px 0;
      background: linear-gradient(135deg, #ff9800, #ffb84d, #ff6b00);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: glow 2s ease-in-out infinite;
      text-shadow: 0 0 20px rgba(255, 152, 0, 0.5);
      position: relative;
      z-index: 1;
    }

    @keyframes glow {
      0%, 100% { filter: drop-shadow(0 0 5px rgba(255, 152, 0, 0.5)); }
      50% { filter: drop-shadow(0 0 15px rgba(255, 152, 0, 0.8)); }
    }

    .section {

    .status-badge {

    .card {

    .wheel-container {

      margin: 30px auto;

    #wheel {
      width: 100%;

      position: relative;
      border: 8px solid rgba(255, 152, 0, 0.6);
      box-shadow: 0 0 30px rgba(255, 152, 0, 0.3), inset 0 0 30px rgba(255, 152, 0, 0.2);
    }

    .wheel-segment {
      position: absolute;
      width: 50%;
      height: 50%;
      top: 0;
      left: 50%;
      transform-origin: 0% 100%;
      background: linear-gradient(135deg, rgba(255, 152, 0, 0.3), rgba(255, 100, 0, 0.2));

      color: #ffb84d;
      text-shadow: 0 0 5px rgba(255, 152, 0, 0.5);
      clip-path: polygon(0 0, 100% 0, 0 100%);

    .wheel-center {
      position: absolute;
      width: 40px;
      height: 40px;
      background: radial-gradient(circle, #ff9800, #c0392b);
      border-radius: 50%;
      top: 50%;
      left: 50%;

    .notifications-container {

    .notification {

      padding: 20px 40px;
      width: 100%;
      box-sizing: border-box;
      animation: slideInDown 0.5s ease-out, slideOutUp 0.5s ease-in 4.5s forwards;
      box-shadow: 0 4px 15px rgba(255, 152, 0, 0.4);
    }

    .notification-text {
      color: #000;
      font-weight: bold;
      font-size: 18px;
      margin: 0;
    }

    @keyframes slideInDown {
      from {
        transform: translateY(-100%);
        opacity: 0;
      }
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    @keyframes slideOutUp {
      from {
        transform: translateY(0);
        opacity: 1;
      }
      to {
        transform: translateY(-100%);
        opacity: 0;

      'Romeo_Villaneda', 'Romeo_Villanera', 'Romeo_Villanesca', 'Romeo_Villanesco', 'Romeo_Villanete',
      'Alicia_Santiago', 'Alicia_Santangelo', 'Alicia_Santamador', 'Alicia_Santamadora', 'Alicia_Santamadore',
      'Joseph_Deleon', 'Joseph_Deleone', 'Joseph_Deleoned', 'Joseph_Deleoneda', 'Joseph_Deleoni',

    const rewards = [100, 200, 500, 1000];

    const wheelPrizes = [
      { points: 0.20, chance: 60 },

      { points: 0.80, chance: 4.9 },
      { points: 1, chance: 0.08 },

    function getRandomBotUsername() {
      return pinoyUsernames[Math.floor(Math.random() * pinoyUsernames.length)];
    }

    function getRandomReward() {
      return rewards[Math.floor(Math.random() * rewards.length)];
    }

    function showNotification(message) {
      const container = document.getElementById('notificationsContainer');
      const notification = document.createElement('div');
      notification.className = 'notification';
      notification.innerHTML = `<p class="notification-text">${message}</p>`;
      container.appendChild(notification);
      
      document.body.classList.add('notification-active');

      setTimeout(() => {
        notification.remove();
        if (container.children.length === 0) {
          document.body.classList.remove('notification-active');
        }
      }, 5000);
    }

    function createWheel() {
      const wheelDiv = document.getElementById('wheel');
      wheelDiv.innerHTML = '';
      
      const segmentAngle = 360 / wheelPrizes.length;
      wheelPrizes.forEach((prize, index) => {
        const segment = document.createElement('div');
        segment.className = 'wheel-segment';
        segment.style.transform = `rotate(${segmentAngle * index}deg)`;
        segment.textContent = '₱' + prize.points;
        wheelDiv.appendChild(segment);
      });
      
      currentRotation = 0;
      wheelDiv.style.transition = 'none';
      wheelDiv.style.transform = `rotate(${currentRotation}deg)`;
    }

    function getRandomPrize() {
      const random = Math.random() * 100;
      let cumulative = 0;
      
      for (let prize of wheelPrizes) {
        cumulative += prize.chance;
        if (random <= cumulative) {
          return prize;
        }
      }
      
      return wheelPrizes[0];
    }

    function startBotClaims() {
      setInterval(() => {
        const botUsername = getRandomBotUsername();
        const reward = getRandomReward();
        showNotification(`🎉 ${botUsername} claimed ₱${reward}!`);
      }, Math.random() * 20000 + 10000);
    }

    function startHeartbeat() {
      if (heartbeatInterval) clearInterval(heartbeatInterval);
      
      heartbeatInterval = setInterval(async () => {
        lastHeartbeatTime = Date.now();
        if (userRef) {
          try {
            await setDoc(userRef, { lastHeartbeat: Date.now(), activityStatus: "active" }, { merge: true });
          } catch (err) {
            console.error("Heartbeat error:", err);
          }
        }
      }, 30000);
    }

    function stopHeartbeat() {
      if (heartbeatInterval) clearInterval(heartbeatInterval);
    }

    function updateUI() {
      const points = (minuteCounter / 300).toFixed(4);
      document.getElementById("points").innerText = points + " points";
      document.getElementById("pending").innerText = userData.pendingEarnings || 0;
      document.getElementById("total").innerText = userData.totalEarnings || 0;

      const statusBadge = document.getElementById("statusBadge");
      if (userData.banned === true) {
        statusBadge.classList.remove("status-active");
        statusBadge.classList.add("status-inactive");
        statusBadge.textContent = "⛔ BANNED";
      } else if (watching === true) {
        statusBadge.classList.remove("status-inactive");
        statusBadge.classList.add("status-active");
        statusBadge.textContent = "🟢 WATCHING";
      } else {
        statusBadge.classList.remove("status-active");
        statusBadge.classList.add("status-inactive");
        statusBadge.textContent = "⚫ INACTIVE";
      }
    }

    function recordInteraction(type) {
      if (!currentWatchSession) return;
      
      switch(type) {
        case 'click':
          interactionStats.clicks++;
          break;
        case 'touch':
          interactionStats.touches++;
          break;
        case 'mouseEnter':
          interactionStats.mouseEnters++;
          break;
      }
      interactionStats.lastInteractionTime = Date.now();
    }

    window.playVideo = async function() {
      const selectedUrl = document.getElementById("seriesSelect").value;
      const series = document.getElementById("seriesSelect").options[document.getElementById("seriesSelect").selectedIndex].text;

      if (!selectedUrl) {
        alert("❌ Please select a series first!");
        return;
      }

      watching = true;
      updateUI();

      const iframeContainer = document.getElementById("iframeContainer");
      iframeContainer.innerHTML = `
        <div style="position: relative; width: 100%; padding-bottom: 56.25%;">
          <iframe id="watchFrame" src="${selectedUrl}" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; border-radius: 10px;" allowfullscreen></iframe>
        </div>
      `;

      // ✅ Start Watch Session
      currentWatchSession = {
        series: series,
        startTime: Date.now(),
        url: selectedUrl,
        interactions: {}
      };

      // Track interactions
      document.addEventListener('click', () => recordInteraction('click'));
      document.addEventListener('touchstart', () => recordInteraction('touch'));
      document.addEventListener('mouseenter', () => recordInteraction('mouseEnter'));

      // ✅ Simulate watching (3 minutes = 180 seconds in real-time = 900 watch points)
      let watchTimer = 0;
      const watchInterval = setInterval(() => {
        if (!watching) {
          clearInterval(watchInterval);
          return;
        }
        
        watchTimer += 0.01;
        minuteCounter += 0.01;
        
        // Update UI every second
        if (watchTimer >= 1) {
          updateUI();
          watchTimer = 0;
        }
        
        // Stop after 3 minutes
        if (minuteCounter >= 180) {
          clearInterval(watchInterval);
          watching = false;
          
          currentWatchSession.durationMinutes = 3;
          currentWatchSession.endTime = Date.now();
          currentWatchSession.interactions = interactionStats;
          currentWatchSession.verificationScore = 85;
          
          userData.watchSessions = (userData.watchSessions || []);
          userData.watchSessions.push(currentWatchSession);
          
          if (userRef) {
            setDoc(userRef, { minuteCounter, watchSessions: userData.watchSessions }, { merge: true });
          }
          
          updateUI();
          showNotification("✅ Watch session completed!");
          
          // Reset iframe
          iframeContainer.innerHTML = '';
          currentWatchSession = null;
          interactionStats = { clicks: 0, touches: 0, mouseEnters: 0, totalFocusTime: 0, lastInteractionTime: Date.now(), iframeInView: false };
        }
      }, 10);
    };

    window.claimPoints = function() {
      const points = minuteCounter / 300;
      if (points >= 1) {
        const cost = Math.floor(points);
        const newPending = (userData.pendingEarnings || 0) + cost;
        minuteCounter -= cost * 300;
        setDoc(userRef, { minuteCounter, pendingEarnings: newPending }, { merge: true });
        
        const displayName = userData.userName || "User";
        showNotification(`🎉 ${displayName} claimed ₱${cost}!`);
        
        alert("✅ ₱" + cost + " added to Pending Earnings for " +
              displayName + " via " + userData.payoutMethod + "!");
        updateUI();
      } else {
        alert("❌ Not enough points yet!");
      }
    };

    window.logout = () => signOut(auth).then(async () => {
      stopHeartbeat();
      if (userRef) {
        await setDoc(userRef, { activityStatus: "inactive" }, { merge: true });
      }
      window.location.href = "index.html";

    onAuthStateChanged(auth, async (u) => {
      if (u) {
        userRef = doc(db, "users", u.uid);
        const snap = await getDoc(userRef);

        if (snap.exists()) {
          userData = snap.data();

              </div>
            `;
            return;
          }

          document.getElementById("greeting").innerText =
            "Hello, " + currentUserName + "!";

          minuteCounter = userData.minuteCounter || 0;
          createWheel();
          updateUI();
          startBotClaims();
          startHeartbeat();

          if (u.email === "shadowtrimz@gmail.com") {
            const adminBtn = document.getElementById("adminBtn");
            adminBtn.style.display = "inline-block";
          }
        } else {
          console.error("User not found in Firestore");
          window.location.href = "index.html";
        }
      } else {
        window.location.href = "index.html";
      }
    });

    window.goToAdmin = function() {
      window.location.href = "admin.html";
    };
  </script>
